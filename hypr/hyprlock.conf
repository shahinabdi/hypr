background {
    monitor =
    path = ~/.config/wallpapers/lockscreen.jpg
    blur_passes = 2
    blur_size = 4
    color = rgb(1a1b26)
}

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

input-field {
    monitor =
    size = 280, 55
    position = 0, -80
    halign = center
    valign = center

    outer_color = rgb(7aa2f7)
    inner_color = rgb(24283b)
    font_color = rgb(c0caf5)
    check_color = rgb(9ece6a)
    fail_color = rgb(f7768e)

    placeholder_text = Password...
    rounding = 12
    outline_thickness = 2
}
